plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace "net.eos.app"
    compileSdk 35

    defaultConfig {
        applicationId "net.eos.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions += "delivery"
    productFlavors {
        wrapper {
            dimension "delivery"
            applicationIdSuffix ".wrapper"
            versionNameSuffix "-wrapper"
            buildConfigField "boolean", "USE_BUNDLED_ASSETS", "false"
            buildConfigField "String", "APP_URL", "\"https://eos-app.net/\""
        }
        bundled {
            dimension "delivery"
            applicationIdSuffix ".bundled"
            versionNameSuffix "-bundled"
            buildConfigField "boolean", "USE_BUNDLED_ASSETS", "true"
            buildConfigField "String", "APP_URL", "\"https://eos-app.net/\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
